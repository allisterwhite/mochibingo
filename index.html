<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mochi Bingo! Tablet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1033;--panel:#261a4d;--panel2:#31245f;--line:#45378a;
  --text:#fff8ee;--dim:#bfb5df;--dim2:#8a7fb3;
  --pink:#ff5d8f;--yellow:#ffd23f;--green:#3ddc97;--blue:#4cc9f0;--red:#ff4d6d;--orange:#ff9f1c;
  --disp:'Baloo 2','Arial Rounded MT Bold',sans-serif;--body:'M PLUS Rounded 1c','Baloo 2',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--body);user-select:none;-webkit-user-select:none;
  background-image:radial-gradient(circle at 10% 15%,rgba(255,93,143,.12) 0 90px,transparent 91px),radial-gradient(circle at 92% 85%,rgba(76,201,240,.1) 0 120px,transparent 121px)}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
.mascot{display:block;width:100%;height:100%;overflow:visible}
.gr{color:var(--yellow);font-weight:800}
.blank i{font-style:normal;display:inline-block;border-bottom:3px solid var(--yellow);line-height:1;margin:0 2px}
.jp{color:var(--dim)}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:14px;padding:18px;text-align:center;overflow-y:auto}
.logo{font-family:var(--disp);font-weight:800;line-height:.9;font-size:clamp(44px,11vw,80px);text-shadow:0 5px 0 rgba(0,0,0,.35)}
.logo .m{color:var(--pink)}.logo .b{color:var(--yellow)}
.big-btn{font-family:var(--disp);font-weight:800;font-size:clamp(22px,5vw,30px);padding:14px 28px;border-radius:18px;background:var(--pink);color:#fff;box-shadow:0 6px 0 #b8325f}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8325f}
.big-btn:disabled{opacity:.35}
.msg{font-size:clamp(15px,3.4vw,20px);color:var(--dim);line-height:1.5}
.hero{width:clamp(130px,30vh,240px);height:clamp(150px,34vh,275px);animation:drop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes drop{from{transform:translateY(-60px) scale(.4);opacity:0}}
.youare{font-family:var(--disp);font-weight:800;font-size:clamp(30px,7vw,52px);line-height:1}
.youare b{color:var(--yellow)}
.lobtop{display:flex;align-items:center;gap:22px;justify-content:center;flex-wrap:wrap;text-align:left}
.lobtop .hero{width:clamp(110px,22vh,190px);height:clamp(126px,25vh,218px)}
.rmini{width:min(900px,100%);background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px 16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.rmini-t{font-family:var(--disp);font-weight:800;font-size:20px;color:var(--yellow);text-align:center}
.rmini-s{display:flex;gap:10px;align-items:flex-start;font-size:clamp(14px,2.2vw,17px);line-height:1.35}
.rmini-n{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--yellow);color:#2b2140;font-family:var(--disp);font-weight:800;display:flex;align-items:center;justify-content:center}
.rmini-i{font-size:22px;line-height:1;flex-shrink:0}
.rmini .jp{font-size:.88em}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim2);display:inline-block}
.dot.on{background:var(--green)}

/* header */
.hdr{display:flex;align-items:center;gap:10px;padding:6px 10px;background:rgba(0,0,0,.28);border-bottom:2px solid var(--line);flex-shrink:0}
.hdr .mw{width:40px;height:46px}
.hdr .num{font-family:var(--disp);font-weight:800;font-size:26px;line-height:1}
.hdr .stat{font-family:var(--disp);font-weight:800;font-size:18px;background:var(--panel2);border-radius:10px;padding:2px 10px}
.hdr .stat.y{color:var(--yellow)}
.hdr .sp{flex:1}
.tabs{display:flex;gap:6px}
.tab{font-family:var(--disp);font-weight:800;font-size:18px;padding:6px 14px;border-radius:12px;background:var(--panel2);color:var(--dim);border:2px solid var(--line)}
.tab.on{background:var(--yellow);color:#2b2140;border-color:var(--yellow)}
#tmr{font-family:var(--disp);font-weight:800;font-size:22px;min-width:64px;text-align:center}
#tmr.low{color:var(--red)}
.banner{background:rgba(255,210,63,.14);border-bottom:2px solid rgba(255,210,63,.4);color:var(--yellow);font-weight:800;text-align:center;padding:6px 10px;font-size:clamp(13px,2.6vw,16px);flex-shrink:0}
.banner .jp{color:#e8d48a;font-weight:500;margin-left:6px}
.body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.ansv{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 14px}
.ans-who{display:flex;align-items:center;gap:10px;font-weight:800;font-size:clamp(18px,3.4vw,24px)}
.ans-who .mw{width:54px;height:62px}.ans-who b{color:var(--yellow)}
.ans-q{display:flex;align-items:center;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 16px;width:min(100%,900px)}
.ans-q .e{font-size:clamp(34px,6vw,52px)}
.ans-q .qq{font-weight:800;font-size:clamp(22px,4vw,34px);line-height:1.2}
.ans-q .o{font-size:.6em;color:var(--dim);margin-top:4px}
.ans-a{width:min(100%,900px);border-radius:16px;padding:10px 16px;border:3px solid var(--line);background:var(--panel2)}
.ans-a.yes{border-color:var(--green);background:rgba(61,220,151,.12)}
.ans-a.no{border-color:var(--red);background:rgba(255,77,109,.10)}
.ans-a .l{font-size:14px;font-weight:800;color:var(--dim);margin-bottom:4px}
.ans-a .s1{font-family:var(--disp);font-weight:800;font-size:clamp(28px,5.6vw,46px);line-height:1.15}
.ans-a .s2{font-weight:800;font-size:clamp(20px,3.8vw,30px);margin-top:4px}
.mmb{display:flex;align-items:center;gap:12px;margin:8px auto 0;padding:6px 14px;border-radius:16px;width:min(100%,980px);flex-shrink:0;border:2px solid var(--line);background:var(--panel)}
.mmb .fm{width:46px;height:53px;flex-shrink:0}
.mmb .ft{flex:1;min-width:0}
.mmb .f1{font-family:var(--disp);font-weight:800;font-size:clamp(18px,3.4vw,26px);line-height:1.05}
.mmb .f1 b{color:var(--yellow)}
.mmb .f2{font-size:13px;color:var(--dim)}
.mmb.talk{background:rgba(61,220,151,.12);border-color:var(--green)}
.mmb.done{background:rgba(76,201,240,.12);border-color:var(--blue)}
.mmb.look{background:rgba(255,255,255,.04);border-style:dashed}
.dots i{display:inline-block;animation:dot 1.2s infinite both;font-style:normal}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}
.tries{display:flex;gap:5px;flex-shrink:0}
.tries span{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);background:rgba(0,0,0,.25)}
.tries span.x{background:var(--red);border-color:var(--red)}
.tries span.ok{background:var(--green);border-color:var(--green)}
.matchv{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:10px}
.matchv .big{width:clamp(110px,28vh,210px);height:clamp(126px,32vh,240px);animation:findPop .6s cubic-bezier(.3,1.7,.5,1)}
.matchv .t1{font-family:var(--disp);font-weight:800;font-size:clamp(36px,8vw,64px);line-height:1}
.matchv .t1 b{color:var(--yellow)}
.matchv .t2{color:var(--dim);font-size:clamp(14px,2.6vw,18px)}
.matchv .say{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:6px 16px;font-weight:800;font-size:clamp(16px,3vw,22px)}
.foundbtn{font-family:var(--disp);font-weight:800;font-size:clamp(24px,5vw,36px);background:var(--green);color:#10331f;border-radius:20px;padding:10px 34px;box-shadow:0 6px 0 #1f8a5a}
.foundbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f8a5a}
.foundbtn small{display:block;font-family:var(--body,inherit);font-size:14px;font-weight:700}
.waitf{font-weight:800;font-size:clamp(18px,3.4vw,24px);color:var(--green)}
.lostbtn{background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:6px 14px;font-weight:800;font-size:15px}
.lostbtn small{display:block;font-size:12px;color:var(--dim);font-weight:500}
.lostmsg{color:var(--pink);font-weight:800;font-size:15px}
.sq.asked{opacity:.5}
.sq .nob{position:absolute;top:3px;right:5px;font-size:12px;font-weight:800;color:var(--red)}
.partner{display:flex;align-items:center;gap:10px;background:var(--panel2);border:2px solid var(--green);border-radius:14px;padding:6px 10px;margin-bottom:8px}
.partner .mw{width:50px;height:57px}
.partner b{font-family:var(--disp);font-size:24px;color:var(--yellow)}
@keyframes findPop{from{transform:scale(.7)}}

/* card */
.cardwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.grid{display:grid;gap:6px;width:min(100%,calc((100vh - 130px) * 1.7));max-width:900px;height:100%;max-height:calc(100vw * .82)}
.sq{position:relative;background:var(--panel);border:2.5px solid var(--line);border-radius:14px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;min-height:0;overflow:hidden}
.sq:active{transform:scale(.97)}
.sq .e{font-size:var(--se,28px);line-height:1}
.sq .c{font-weight:800;font-size:var(--sc,14px);line-height:1.15}
.sq .cj{font-size:calc(var(--sc,14px)*.72);color:var(--dim);line-height:1.15}
.sq .info{position:absolute;top:3px;right:5px;font-size:calc(var(--sc,14px)*.85)}
.sq.done{background:rgba(61,220,151,.16);border-color:var(--green)}
.sq.line{border-color:var(--yellow);background:rgba(255,210,63,.16)}
.sq.free{background:rgba(255,210,63,.12);border-style:dashed;border-color:var(--yellow)}
.sq.free .e{font-size:calc(var(--se,28px)*1.2)}
.sq.lock{opacity:.5}
.sq .stamp{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(26,16,51,.55);animation:stamp .4s cubic-bezier(.3,1.7,.5,1)}
.sq .stamp .mw{height:min(calc(var(--se,28px)*2.15),58%);aspect-ratio:100/120;width:auto}
.sq .stamp b{font-family:var(--disp);font-size:calc(var(--sc,14px)*1.15);line-height:1}
.sq .stamp small{font-size:calc(var(--sc,14px)*.8);color:var(--dim)}
@keyframes stamp{from{transform:scale(2.2) rotate(-12deg);opacity:0}}
.sq .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:800;font-size:calc(var(--sc,14px)*2);color:var(--red);background:rgba(0,0,0,.35)}
.preview .sq{pointer-events:none}

/* sheet */
#sheet{position:fixed;inset:0;background:rgba(10,6,24,.75);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.on{display:flex}
.sh{background:var(--panel);border:2px solid var(--line);border-bottom:none;border-radius:22px 22px 0 0;width:min(100%,980px);max-height:100%;overflow-y:auto;padding:14px 16px 16px;animation:up .25s ease-out;display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
@keyframes up{from{transform:translateY(60px)}}
.sh .full{grid-column:1/-1}
.sh-top{display:flex;align-items:center;gap:12px}
.sh-top .e{font-size:44px}
.sh-top .f{font-size:clamp(16px,2.6vw,20px);color:var(--yellow);font-weight:800;letter-spacing:.03em}
.sh-top>div:nth-child(2){flex:1}
.sh-top .c{font-family:var(--disp);font-weight:800;font-size:clamp(22px,4vw,30px);line-height:1.1}
.sh-top .x{margin-left:auto;width:44px;height:44px;border-radius:50%;background:var(--panel2);font-size:20px;flex-shrink:0}
.askbox{background:var(--panel2);border-radius:14px;padding:10px 12px}
.askbox .l{font-size:12px;font-weight:800;color:var(--pink);letter-spacing:.08em}
.askbox .q{font-weight:800;font-size:clamp(18px,3.4vw,24px);line-height:1.3;margin-top:2px}
.askbox .o{font-size:14px;color:var(--dim);margin-top:4px}
.numrow{display:flex;align-items:center;gap:10px}
.numbox{flex:1;font-family:var(--disp);font-weight:800;font-size:40px;background:var(--bg);border:2.5px solid var(--yellow);border-radius:14px;text-align:center;height:62px;line-height:62px}
.numbox.empty{color:var(--dim2);font-size:20px;border-color:var(--line)}
.prev{width:56px;height:64px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.pad button{font-family:var(--disp);font-weight:800;font-size:24px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;height:48px}
.pad button:active{background:var(--line)}
.lbl2{font-size:13px;font-weight:800;color:var(--dim);margin-bottom:6px}
.ans{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.ans button{font-family:var(--disp);font-weight:800;font-size:22px;background:var(--panel2);border:2px solid var(--line);border-radius:12px;height:46px}
.ans button.on{background:var(--yellow);color:#2b2140;border-color:var(--yellow)}
.claim{flex:2;font-size:26px}
.ynrow{display:flex;gap:10px;width:100%}
.nobtn{flex:1;font-size:24px;background:var(--panel2);color:var(--text);box-shadow:0 6px 0 #1b1238;border:2px solid var(--line)}
.nobtn small{font-size:14px;color:var(--dim)}
.fb{min-height:24px;font-weight:800;text-align:center;font-size:16px}
.fb.bad{color:var(--red)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* me */
.me{flex:1;min-height:0;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.mehead{display:flex;align-items:center;gap:14px;justify-content:center}
.mehead .mw{width:80px;height:92px}
.mehead .t{font-family:var(--disp);font-weight:800;font-size:clamp(26px,5vw,38px);line-height:1}
.mehead .t b{color:var(--yellow)}
.mehead .s{font-size:14px;color:var(--dim)}
.ghead{font-family:var(--disp);font-weight:800;font-size:20px;display:flex;align-items:center;gap:8px;margin:8px 2px -2px;color:var(--yellow)}
.ghead small{font-family:var(--body);font-size:13px;color:var(--dim);font-weight:500}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.pc{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 12px}
.pc .h{display:flex;gap:8px;align-items:center;font-weight:800;color:var(--dim);font-size:14px}
.pc .h span{font-size:22px}
.pc .sent{font-weight:800;font-size:clamp(18px,3.2vw,22px);margin-top:4px;display:flex;gap:8px;align-items:center}
.pc .yn{font-size:13px;color:var(--dim);margin-top:2px}
.pc .yn b{color:var(--green)}.pc .yn i{color:var(--red);font-style:normal;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ch{border-radius:99px;padding:3px 10px;font-size:14px;font-weight:800;background:rgba(0,0,0,.25);color:var(--dim2);text-decoration:line-through;text-decoration-color:rgba(255,77,109,.6)}
.ch.on{background:rgba(61,220,151,.2);color:var(--text);text-decoration:none;border:1.5px solid var(--green)}
.ch.on em{font-style:normal;color:var(--yellow)}

/* overlays */
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:40;background:rgba(18,10,38,.86);text-align:center}
#ov.on{display:flex}
.lock1{font-weight:800;font-size:14px;color:var(--yellow);text-align:right;line-height:1.1}.lock1 small{display:block;font-size:11px;color:var(--dim);font-weight:500}
.rulesfab{position:fixed;left:12px;bottom:12px;z-index:30;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:8px 14px;font-weight:800;font-size:16px;color:var(--text)}
.bw{display:flex;gap:4px;font-family:var(--disp);font-weight:800;font-size:clamp(64px,16vw,130px);line-height:1}
.bw span{display:inline-block;animation:letter .6s cubic-bezier(.3,1.8,.5,1) both;text-shadow:0 6px 0 rgba(0,0,0,.4)}
@keyframes letter{from{transform:translateY(-100px) scale(.2);opacity:0}}
.cdn{font-family:var(--disp);font-weight:800;font-size:clamp(120px,30vw,240px);color:var(--yellow);animation:cdz .8s ease-out both}
@keyframes cdz{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(.9)}}
.confetti{position:fixed;top:-20px;width:10px;height:16px;border-radius:3px;z-index:41;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.place{font-family:var(--disp);font-weight:800;font-size:clamp(46px,12vw,90px);line-height:1}
.statrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.statrow div{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 16px;font-weight:800;font-size:18px}
.statrow b{font-family:var(--disp);font-size:28px;color:var(--yellow);display:block;line-height:1}
@media (max-width:700px){.sh{grid-template-columns:1fr}}
/* ── bigger text for small tablets (6 Oct) ── */
.msg{font-size:clamp(17px,3.8vw,22px)}
.rmini-s{font-size:clamp(16px,2.6vw,19px)}
.hdr .num{font-size:30px}.hdr .stat{font-size:21px}
.tab{font-size:20px}#tmr{font-size:26px}
.banner{font-size:clamp(15px,3vw,19px)}
.mmb .f1{font-size:clamp(22px,4.2vw,32px)}
.mmb .f2{font-size:clamp(14px,2.4vw,17px)}
.ans-who{font-size:clamp(20px,3.8vw,28px)}
.ans-q .qq{font-size:clamp(26px,4.8vw,40px)}
.ans-a .l{font-size:16px}
.ans-a .s1{font-size:clamp(34px,6.8vw,56px)}
.ans-a .s2{font-size:clamp(24px,4.4vw,34px)}
.matchv .t2{font-size:clamp(16px,3vw,21px)}
.matchv .say{font-size:clamp(20px,3.6vw,26px)}
.foundbtn small{font-size:16px}
.waitf{font-size:clamp(20px,3.8vw,28px)}
.lostbtn{font-size:17px}.lostbtn small{font-size:14px}.lostmsg{font-size:17px}
.sq .nob{font-size:14px}
.sh-top .e{font-size:52px}
.sh-top .f{font-size:clamp(19px,3.2vw,24px)}
.askbox .l{font-size:14px}
.askbox .q{font-size:clamp(24px,4.4vw,34px)}
.lbl2{font-size:15px}
.ans button{font-size:26px;height:54px}
.claim{font-size:30px}.nobtn{font-size:28px}.nobtn small{font-size:16px}
.fb{font-size:18px}
.partner b{font-size:28px}
.lock1{font-size:16px}.lock1 small{font-size:13px}
.rulesfab{font-size:18px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" onclick="if(event.target===this)userClose()"><div class="sh" id="sh"></div></div>
<div id="ov"></div>
<script>
// ── SHARED: mascots, sound, Ably helpers (same block in projector + terminal) ──
var ABLY_KEY='4ZBykA.Tuugsg:cgyxBZXHQyC7_2do0olX7UKSMSJi56RhILeV4mZOJCE';
var ABLY_CHANNEL='bingo-room1';
var MASCOT_COLORS=['#ff5d8f','#ffb703','#3ddc97','#4cc9f0','#9b5de5','#ff7b29','#2ec4b6','#f15bb5','#4895ef','#a7c957','#e63946','#b5838d'];
function shadeHex(hex,amt){
  var c=parseInt(hex.slice(1),16),r=c>>16,g=(c>>8)&255,b=c&255,f=amt<0?0:255,p=Math.abs(amt);
  r=Math.round((f-r)*p+r);g=Math.round((f-g)*p+g);b=Math.round((f-b)*p+b);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);

function lineCells(id,s){
  var out=[],k;
  if(id[0]==='r'){k=+id.slice(1);for(var c=0;c<s;c++)out.push(k*s+c)}
  else if(id[0]==='c'){k=+id.slice(1);for(var r=0;r<s;r++)out.push(r*s+k)}
  else if(id==='d0'){for(var i=0;i<s;i++)out.push(i*s+i)}
  else for(var j=0;j<s;j++)out.push(j*s+s-1-j);
  return out;
}

  entryNum=live?String(m.p):'';
  var h='<div class="sh-top full"><div class="e">'+q.e+'</div><div><div class="f">'+(live?'🗣️ ASK #'+m.p+' · '+m.p+'番に聞こう':'YOUR SQUARE · マス')+'</div><div class="jp">'+escHTML(me.cardJp?q.condJp:'')+'</div></div>'+(live?'<div class="lock1">🔒 Ask this one!<small>このマスを聞こう</small></div>':'<button class="x" onclick="userClose()">✕</button>')+'</div>';
  h+='<div><div class="askbox"><div class="l">① ASK · 質問しよう</div>';
  if(help==='none')h+='<div class="q" style="color:var(--dim)">Make the question yourself!<br><span style="font-size:.75em">自分で質問を作ろう！</span></div>';
  else{h+='<div class="q">'+frameHTML(q.q,help)+'</div>'}
  h+='</div>';
  if(q.info)h+='<div class="askbox" style="margin-top:8px"><div class="l">② THEN ASK · 次に聞こう</div><div class="q">'+(help==='none'?'<span style="color:var(--dim)">'+(q.unit==='years'?'How long…?':'How many…?')+'</span>':frameHTML(q.q2,help))+'</div></div>';
  h+='</div><div>';
  if(live)h+='<div class="partner"><div class="mw">'+mascotSVG(m.p)+'</div><div>Ask <b>#'+m.p+'</b><div class="lbl2" style="margin:0">'+m.p+'番に聞こう · try '+(m.tries+1)+' / '+(m.max||3)+'</div></div></div>';
  else h+='<div class="partner" style="border-color:var(--line)"><div>'+(m.s==='talk'?'✓ Your turn is done. 自分の番は終わり':'👀 Find your partner and tap <b style="font-size:inherit">FOUND</b> first!<br><span class="lbl2">まず相手を見つけて「FOUND」を押そう</span>')+'</div></div>';
  if(q.info&&live){
    h+='<div class="lbl2" style="margin-top:10px">Their answer · 相手の答え ('+escHTML(q.unit)+')</div><div class="ans">';
    for(var v=q.min;v<=q.max;v++)h+='<button class="'+(entryAns===v?'on':'')+'" onclick="pickAns('+v+')">'+v+'</button>';
    h+='</div>';
  }
  h+='</div>';
  var ready=live&&(!q.info||entryAns!=null)&&!_claimWait;
  h+='<div class="full"><div class="fb'+(sheetBad?' bad':'')+'">'+sheetMsg+'</div><div class="ynrow"><button class="big-btn nobtn" '+(live&&!_claimWait?'':'disabled')+' onclick="doNo()">✗ NO <small>いいえ</small></button><button class="big-btn claim" '+(ready?'':'disabled')+' onclick="doClaim()">'+(_claimWait?'…':'✓ YES <small>はい</small>')+'</button></div></div>';
  $('sh').innerHTML=h;
}
function pickAns(v){entryAns=v;sheetMsg='';sheetBad=false;renderSheet()}
function doNo(){
  if(!canAsk()||sheetSq==null||!me)return;
  var m=mmv(),n=m.p,sq=sheetSq;
  pub('no',{did:did,gameId:me.gameId,sq:sq,target:n});_pend.no={sq:sq,n:n,tries:m.tries||0,at:m.at};
  m.tries=(m.tries||0)+1;m.asked=(m.asked||[]).concat([sq]);m.turn=n; // switch now; the projector confirms
  closeSheet();tSfxNo();render();
}
function doClaim(){
  if(!canAsk()||_claimWait)return;
  _claimWait=true;renderSheet();
  pub('claim',{did:did,gameId:me.gameId,sq:sheetSq,target:mmv().p,ans:entryAns});
  setTimeout(function(){if(_claimWait){_claimWait=false;sheetMsg='No reply — try again · もう一度';sheetBad=true;renderSheet()}},6000);
}
// a wrong YES / wrong number: big "check again" for a moment, then back to the same question to fix it (no penalty)
function checkAgain(why){var ov=$('ov');ov.dataset.t='';ov.innerHTML='<div style="font-size:70px">🔁</div><div style="font-family:var(--disp);font-weight:800;font-size:clamp(28px,6vw,46px);color:var(--yellow);padding:0 20px">Check again!</div><div class="msg" style="font-size:20px">'+why[0].replace(/^🔁 Check again! /,'')+'<br>'+why[1]+'</div>';
  ov.classList.add('on');ov.onclick=function(){ov.classList.remove('on')};clearTimeout(_toastT);_toastT=setTimeout(function(){ov.classList.remove('on')},1800)}
var _toastT=null;
function notice(icon,en,jp){
  var ov=$('ov');ov.dataset.t='';ov.innerHTML='<div style="font-size:70px">'+icon+'</div><div style="font-family:var(--disp);font-weight:800;font-size:clamp(22px,5vw,32px);color:var(--yellow);padding:0 20px">'+en+'</div><div class="msg">'+jp+'</div>';
  ov.classList.add('on');ov.onclick=function(){ov.classList.remove('on')};clearTimeout(_toastT);_toastT=setTimeout(function(){ov.classList.remove('on')},3200);
}
function toast(html){
  var ov=$('ov');ov.dataset.t='';ov.innerHTML='<div style="font-size:70px">🙅</div><div style="font-family:var(--disp);font-weight:800;font-size:clamp(22px,5vw,34px);color:var(--red);padding:0 20px">'+html+'</div><div class="msg">Square locked for a few seconds · 少し待ってね</div>';
  ov.classList.add('on');ov.onclick=function(){ov.classList.remove('on')};
  clearTimeout(_toastT);_toastT=setTimeout(function(){ov.classList.remove('on')},2400);
}

// ── BIG MOMENTS ──
function showBingo(place){
  var cols=['var(--pink)','var(--yellow)','var(--green)','var(--blue)','var(--orange)'];
  var ov=$('ov');ov.dataset.t='';
  ov.innerHTML='<div class="bw">'+'BINGO!'.split('').map(function(c,i){return '<span style="color:'+cols[i%5]+';animation-delay:'+i*0.06+'s">'+c+'</span>'}).join('')+'</div>'+
    '<div class="hero" style="height:clamp(120px,26vh,220px);width:clamp(104px,23vh,190px)">'+mascotSVG(me.n)+'</div>'+
    '<div style="font-family:var(--disp);font-weight:800;font-size:clamp(24px,6vw,40px);color:var(--yellow)">'+(place?ordinal(place)+' BINGO!':'ANOTHER LINE!')+'</div><div class="msg">Keep going! もっとラインを作ろう！</div>';
  ov.classList.add('on');ov.onclick=function(){ov.classList.remove('on')};
  var c=['#ff5d8f','#ffd23f','#3ddc97','#4cc9f0','#9b5de5'];
  for(var i=0;i<40;i++){var d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=c[i%5];d.style.animationDuration=(1.5+Math.random()*1.5)+'s';document.body.appendChild(d);setTimeout(function(el){return function(){el.remove()}}(d),3500)}
  clearTimeout(_toastT);_toastT=setTimeout(function(){ov.classList.remove('on')},3000);
}
function countdown(){
  var ov=$('ov'),n=3;ov.dataset.t='';ov.classList.add('on');ov.onclick=null;
  var step=function(){
    if(n>0){ov.innerHTML='<div class="cdn">'+n+'</div>';n--;setTimeout(step,850)}
    else{ov.innerHTML='<div class="cdn" style="color:var(--pink)">GO!</div><div class="msg">Ask in English! 英語で聞こう！</div>';tab='card';setTimeout(function(){ov.classList.remove('on');render()},800)}
  };step();
}

// ── INIT ──
render();
(function(){var sc=document.createElement('script');sc.src='https://cdn.ably.com/lib/ably.min-2.js';sc.onload=initAbly;document.head.appendChild(sc)})();
</script>
